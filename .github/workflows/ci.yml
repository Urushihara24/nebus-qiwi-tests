name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile
        run: python -m py_compile test_qiwi_api.py
      - name: Collect tests without live payment requests
        env:
          QIWI_BASE_URL: https://example.invalid
          QIWI_TOKEN: ci-placeholder
          QIWI_ACCOUNT: "79000000000"
        run: pytest --collect-only -q test_qiwi_api.py
